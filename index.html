<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Annotator v3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ── 헤더 전체 (상단바 + 풀다운을 하나의 fixed 블록으로) ── -->
    <div class="header-wrap">

      <!-- 상단 바 -->
      <div class="top-bar">
        <span class="app-title">PDF Annotator v3.0</span>

        <!-- PC 툴바 -->
        <div class="toolbar-pc">
          <label class="file-btn">파일 선택 <input type="file" id="fileInput" accept="application/pdf" /></label>
          <button onclick="setTool('highlight')">🖊 형광펜</button>
          <input type="color" id="highlightColor" value="#ffff00" title="형광펜 색상" />
          <button onclick="setTool('text')">📝 텍스트</button>
          <span class="sep"></span>
          <button onclick="zoomOut()">🔍−</button>
          <select id="zoomSelect" onchange="setZoom(this.value)">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1.0">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5" selected>150%</option>
            <option value="1.75">175%</option>
            <option value="2.0">200%</option>
            <option value="2.5">250%</option>
            <option value="3.0">300%</option>
          </select>
          <button onclick="zoomIn()">🔍+</button>
          <span class="sep"></span>
          <button onclick="prevPage()">◀</button>
          <span id="pageInfo" class="page-info"></span>
          <button onclick="nextPage()">▶</button>
          <span class="sep"></span>
          <button onclick="undo()">↩ 실행취소</button>
          <button onclick="clearNotes()">🗑 초기화</button>
          <button onclick="saveToBrowser()">💾 저장</button>
          <button onclick="exportJSON()">📤 내보내기</button>
          <button onclick="importJSON()">📥 불러오기</button>
        </div>

        <!-- 모바일 툴바 -->
        <div class="toolbar-mobile">
          <label class="file-btn-mobile">📂 <input type="file" id="fileInputMobile" accept="application/pdf" /></label>
          <button onclick="prevPage()">◀</button>
          <span id="pageInfoMobile" class="page-info"></span>
          <button onclick="nextPage()">▶</button>
          <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
        </div>
      </div>

      <!-- 모바일 풀다운 메뉴 (header-wrap 안에 있어야 올바르게 배치됨) -->
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-inner">
          <div class="dropdown-row">
            <button onclick="setTool('highlight'); closeMenu()">🖊 형광펜</button>
            <input type="color" id="highlightColorMobile" value="#ffff00" />
            <button onclick="setTool('text'); closeMenu()">📝 텍스트</button>
          </div>
          <div class="dropdown-row">
            <button onclick="zoomOut()">🔍−</button>
            <select id="zoomSelectMobile" onchange="setZoom(this.value)">
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1.0">100%</option>
              <option value="1.25">125%</option>
              <option value="1.5" selected>150%</option>
              <option value="1.75">175%</option>
              <option value="2.0">200%</option>
              <option value="2.5">250%</option>
              <option value="3.0">300%</option>
            </select>
            <button onclick="zoomIn()">🔍+</button>
          </div>
          <div class="dropdown-row">
            <button onclick="undo(); closeMenu()">↩ 실행취소</button>
            <button onclick="clearNotes(); closeMenu()">🗑 초기화</button>
          </div>
          <div class="dropdown-row">
            <button onclick="saveToBrowser(); closeMenu()">💾 저장</button>
            <button onclick="exportJSON(); closeMenu()">📤 내보내기</button>
            <button onclick="importJSON(); closeMenu()">📥 불러오기</button>
          </div>
        </div>
      </div>

    </div><!-- /.header-wrap -->

    <!-- ── 레이아웃 ── -->
    <div class="layout">
      <!-- 사이드바: PC에만 표시, 광고 포함 -->
      <div class="sidebar">
        <div class="panel">
          <strong>도구 설명</strong>
          <p>형광펜: 클릭 위치에 하이라이트</p>
          <p>텍스트: 클릭 후 텍스트 입력</p>
        </div>
        <div class="panel">
          <strong>Trip.com × Rail Europe</strong>
          <div class="trip-ad-box">
            <a href="https://www.trip.com/t/zGQ0YJsVIV2" target="_blank" rel="noopener">
              <img src="trip_ad_banner.png" alt="Trip Ad" class="trip-banner" />
            </a>
          </div>
        </div>
      </div>

      <!-- 메인 영역 -->
      <div class="main-area">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </div>

    <!-- ── 푸터 ── -->
    <div class="footer">
      PDF Annotator v3.0 · Non-destructive notes · LocalStorage & JSON export 지원
    </div>

    <!-- ── 하단 광고: 모바일에서만 표시 (ads.js가 삽입) ── -->

    <!-- ── 텍스트 입력 모달 ── -->
    <div class="modal-overlay" id="textModal">
      <div class="modal-box">
        <p>텍스트 입력:</p>
        <input type="text" id="textInput" placeholder="내용을 입력하세요" />
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeTextModal()">취소</button>
          <button class="btn-confirm" onclick="confirmTextModal()">확인</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script src="ads.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js');
        });
      }

      // ── 햄버거 메뉴 ──
      function toggleMenu() {
        document.getElementById('dropdownMenu').classList.toggle('open');
      }
      function closeMenu() {
        document.getElementById('dropdownMenu').classList.remove('open');
      }
      document.addEventListener('click', (e) => {
        const menu = document.getElementById('dropdownMenu');
        const btn = document.querySelector('.hamburger-btn');
        if (menu.classList.contains('open') &&
            !menu.contains(e.target) && e.target !== btn) {
          closeMenu();
        }
      });

      // ── 모바일 파일 입력 연동 ──
      document.getElementById('fileInputMobile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) loadPDF(URL.createObjectURL(file));
      });

      // ── 모바일 색상 연동 ──
      document.getElementById('highlightColorMobile').addEventListener('input', (e) => {
        document.getElementById('highlightColor').value = e.target.value;
      });

      // ── 모바일 배율 연동 ──
      document.getElementById('zoomSelectMobile').addEventListener('change', (e) => {
        setZoom(e.target.value);
        document.getElementById('zoomSelect').value = e.target.value;
      });

      // ── 페이지 이동 ──
      function prevPage() {
        if (!window.pdfDoc || window.currentPage <= 1) return;
        window.currentPage--;
        renderPage(window.currentPage);
        updatePageInfo();
      }
      function nextPage() {
        if (!window.pdfDoc || window.currentPage >= window.pdfDoc.numPages) return;
        window.currentPage++;
        renderPage(window.currentPage);
        updatePageInfo();
      }
      function updatePageInfo() {
        const text = window.pdfDoc
          ? `${window.currentPage} / ${window.pdfDoc.numPages}` : '';
        ['pageInfo','pageInfoMobile'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = text;
        });
      }
      window.updatePageInfo = updatePageInfo;
    </script>
  </body>
</html>
