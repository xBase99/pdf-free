<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Annotator v3.0</title>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />

    <!-- 스타일 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 상단 바 -->
    <div class="top-bar">
      <span class="app-title">PDF Annotator v3.0</span>
      <input type="file" id="fileInput" accept="application/pdf" />
      <button onclick="setTool('highlight')">형광펜</button>
      <input type="color" id="highlightColor" value="#ffff00" />
      <button onclick="setTool('text')">텍스트</button>
      <button onclick="saveToBrowser()">저장</button>
      <button onclick="exportJSON()">내보내기</button>
      <button onclick="importJSON()">불러오기</button>
      <button onclick="undo()">↩ 실행취소</button>
      <button onclick="clearNotes()">초기화</button>
      <!-- 배율 조절 -->
      <button onclick="zoomOut()">🔍−</button>
      <select id="zoomSelect" onchange="setZoom(this.value)">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1.0">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5" selected>150%</option>
        <option value="1.75">175%</option>
        <option value="2.0">200%</option>
        <option value="2.5">250%</option>
        <option value="3.0">300%</option>
      </select>
      <button onclick="zoomIn()">🔍+</button>
      <!-- 페이지 이동 -->
      <button onclick="prevPage()">◀ 이전</button>
      <span id="pageInfo"></span>
      <button onclick="nextPage()">다음 ▶</button>
    </div>

    <!-- 레이아웃 -->
    <div class="layout">
      <!-- 사이드바 (PC 전용 - 모바일에서는 CSS로 숨김) -->
      <div class="sidebar">
        <div class="panel">
          <strong>도구 설명</strong>
          <p>형광펜: 클릭 위치에 하이라이트 박스</p>
          <p>텍스트: 클릭 후 텍스트 입력</p>
        </div>
        <div class="panel">
          <strong>Trip.com × Rail Europe</strong>
          <div class="trip-ad-box">
            <a href="https://www.trip.com/t/zGQ0YJsVIV2" target="_blank" rel="noopener">
              <img src="trip_ad_banner.png" alt="Trip Ad" class="trip-banner" />
            </a>
          </div>
        </div>
      </div>

      <!-- 메인 영역 -->
      <div class="main-area">
        <canvas id="pdfCanvas"></canvas>
      </div>
    </div>

    <!-- 푸터 -->
    <div class="footer">
      PDF Annotator v3.0 · Non-destructive notes · LocalStorage & JSON export 지원
    </div>

    <!-- 텍스트 입력 모달 (prompt 대체 - 모바일 호환) -->
    <div class="modal-overlay" id="textModal">
      <div class="modal-box">
        <p>텍스트 입력:</p>
        <input type="text" id="textInput" placeholder="내용을 입력하세요" />
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeTextModal()">취소</button>
          <button class="btn-confirm" onclick="confirmTextModal()">확인</button>
        </div>
      </div>
    </div>

    <!-- 앱 로직 -->
    <script src="app.js"></script>
    <!-- 광고 (하단에만 삽입) -->
    <script src="ads.js"></script>

    <!-- 서비스 워커 등록 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js');
        });
      }

      function prevPage() {
        if (!window.pdfDoc) return;
        if (window.currentPage <= 1) return;
        window.currentPage--;
        renderPage(window.currentPage);
        updatePageInfo();
      }

      function nextPage() {
        if (!window.pdfDoc) return;
        if (window.currentPage >= window.pdfDoc.numPages) return;
        window.currentPage++;
        renderPage(window.currentPage);
        updatePageInfo();
      }

      function updatePageInfo() {
        const el = document.getElementById('pageInfo');
        if (!window.pdfDoc) { el.textContent = ''; return; }
        el.textContent = `페이지 ${window.currentPage} / ${window.pdfDoc.numPages}`;
      }

      window.updatePageInfo = updatePageInfo;
    </script>
  </body>
</html>
