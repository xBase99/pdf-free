<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PDF Annotator Free (xBase99)</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
    </script>
  </head>

  <body>
    <header>
      <h1>PDF Annotator Free</h1>
      <p>기능 제한 없음 · 무료 사용기간 6개월</p>
    </header>

    <!-- 설치 버튼 -->
    <button id="installBtn" class="install-btn">앱 설치하기</button>

    <script>
      let deferredPrompt;
      const installBtn = document.getElementById('installBtn');
      installBtn.style.display = 'none';

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'inline-block';
      });

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt = null;
      });
    </script>

    <!-- PDF Annotator UI -->
    <main>
      <div class="toolbar">
        <button onclick="addDummyAnnotation()">주석 추가</button>
        <button onclick="undo()">되돌리기</button>
        <button onclick="deleteLast()">마지막 주석 삭제</button>
        <span id="statusText" class="status"></span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="pdfCanvas" width="800" height="600"></canvas>
      </div>
    </main>

    <footer>
      <small>© xBase99 · PDF Annotator Free</small>
    </footer>

    <script src="app.js"></script>
    <script src="ads.js"></script>
  </body>
</html>
