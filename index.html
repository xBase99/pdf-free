<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="appTitle">PDF Annotator v3.0</title>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── 숨겨진 파일 입력 (PDF & JSON) ── -->
    <input
      type="file"
      id="fileInput"
      accept="application/pdf"
      style="display: none"
    />
    <input
      type="file"
      id="jsonFileInput"
      accept=".json"
      style="display: none"
      onchange="handleJSONFileSelect(event)"
    />

    <!-- ── 헤더 영역 ── -->
    <header class="header-wrap">
      <div class="top-bar">
        <span class="app-title" data-i18n="appTitle">PDF Annotator v3.0</span>
        <div class="sep"></div>

        <!-- PC 상단 툴바 -->
        <div class="toolbar-pc">
          <button
            onclick="document.getElementById('fileInput').click()"
            data-i18n="fileSelect"
          >
            📁 파일 선택
          </button>

          <div class="sep"></div>

          <button onclick="setTool('highlight')" data-i18n="highlight">
            🖊 형광펜
          </button>
          <input
            type="color"
            id="highlightColor"
            value="#ffff00"
            title="형광펜 색상"
          />

          <button onclick="setTool('text')" data-i18n="text">📝 텍스트</button>
          <input
            type="color"
            id="textColor"
            value="#d32f2f"
            title="글자 색상"
          />

          <div class="sep"></div>

          <button onclick="zoomOut()">➖</button>
          <select id="zoomSelect" onchange="setZoom(this.value)">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1.0">100%</option>
            <option value="1.25">125%</option>
            <option value="1.5" selected>150%</option>
            <option value="2.0">200%</option>
            <option value="3.0">300%</option>
          </select>
          <button onclick="zoomIn()">➕</button>

          <div class="sep"></div>

          <button onclick="prevPage()">◀</button>
          <span id="pageInfo" class="page-info">1 / 1</span>
          <button onclick="nextPage()">▶</button>

          <div class="sep"></div>

          <button onclick="undo()" data-i18n="undo">↩ 실행취소</button>
          <button onclick="clearNotes()" data-i18n="clear">🗑 초기화</button>

          <div class="sep"></div>

          <button onclick="saveToBrowser()" data-i18n="save">💾 저장</button>
          <button onclick="exportJSON()" data-i18n="export">📤 내보내기</button>
          <button onclick="importJSON()" data-i18n="import">📥 불러오기</button>

          <!-- 🔻 [추가] PC 툴바용 PDF 저장 및 인쇄 버튼 🔻 -->
          <button onclick="exportModifiedPDF('download')" data-i18n="exportPdf">
            📄 PDF 저장
          </button>
          <button onclick="exportModifiedPDF('print')" data-i18n="printPdf">
            🖨️ PDF 인쇄
          </button>
        </div>
      </div>

      <!-- 모바일 드롭다운 메뉴 -->
      <div id="dropdownMenu" class="dropdown-menu">
        <div class="dropdown-inner">
          <div class="dropdown-row">
            <button
              onclick="
                setTool('highlight');
                toggleDropdown();
              "
              data-i18n="highlight"
            >
              🖊 형광펜
            </button>
            <input
              type="color"
              id="highlightColorMobile"
              value="#ffff00"
              onchange="
                document.getElementById('highlightColor').value = this.value
              "
            />
            <button
              onclick="
                setTool('text');
                toggleDropdown();
              "
              data-i18n="text"
            >
              📝 텍스트
            </button>
          </div>
          <div class="dropdown-row">
            <button onclick="zoomOut()">➖</button>
            <button onclick="zoomIn()">➕</button>
            <button
              onclick="
                undo();
                toggleDropdown();
              "
              data-i18n="undo"
            >
              ↩ 실행취소
            </button>
            <button
              onclick="
                clearNotes();
                toggleDropdown();
              "
              data-i18n="clear"
            >
              🗑 초기화
            </button>
          </div>
          <div class="dropdown-row">
            <button
              onclick="
                saveToBrowser();
                toggleDropdown();
              "
              data-i18n="save"
            >
              💾 저장
            </button>
            <button
              onclick="
                exportJSON();
                toggleDropdown();
              "
              data-i18n="export"
            >
              📤 내보내기
            </button>
            <button
              onclick="
                importJSON();
                toggleDropdown();
              "
              data-i18n="import"
            >
              📥 불러오기
            </button>
            <!-- 버튼 추가 -->
            <button
              onclick="exportModifiedPDF('download')"
              data-i18n="exportPdf"
            >
              📄 PDF 저장
            </button>
            <button onclick="exportModifiedPDF('print')" data-i18n="printPdf">
              🖨️ PDF 인쇄
            </button>
          </div>
        </div>
      </div>
    </header>
    <!-- PDF 수정/합성 라이브러리 -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- PDF 인쇄/출력 보조 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- ── 메인 레이아웃 ── -->
    <div class="layout">
      <!-- PDF 캔버스 영역 -->
      <main class="main-area">
        <canvas id="pdfCanvas"></canvas>
      </main>

      <!-- 오른쪽 패널 (광고 영역) -->
      <aside class="right-ads-panel">
        <div class="panel">
          <h4 data-i18n="toolDescTitle">도구 설명</h4>
          <p data-i18n="toolDesc1">형광펜: 클릭 위치에 하이라이트</p>
          <p data-i18n="toolDesc2">텍스트: 클릭 후 텍스트 입력</p>
        </div>

        <!-- 광고 1번 자리 -->
        <div class="trip-ad-item">
          <img src="trip_ad_banner.png" alt="Trip.com Ad 1" />
          <a
            href="https://www.trip.com/t/zGQ0YJsVIV2"
            target="_blank"
            rel="noopener"
            >Trip.com 예약하기</a
          >
        </div>

        <!-- 광고 2번 자리 (추가됨) -->
        <div class="trip-ad-item">
          <img src="hotel_image (6).png" alt="Trip.com Ad 2" />
          <a
            href="https://www.trip.com/t/M8hCI3plfV2"
            target="_blank"
            rel="noopener"
            >Explore Hengqin - Trip.com</a
          >
        </div>
      </aside>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      PDF Annotator &copy; 2026. All rights reserved.
    </footer>

    <!-- ── 텍스트 입력 모달 ── -->
    <div id="textModal" class="modal-overlay">
      <div class="modal-box">
        <p data-i18n="modalTitle">텍스트 입력</p>
        <input
          type="text"
          id="textInput"
          placeholder="내용을 입력하세요"
          data-i18n-ph="modalPlaceholder"
          autocomplete="off"
        />
        <div class="modal-actions">
          <button
            class="btn-cancel"
            onclick="closeTextModal()"
            data-i18n="cancel"
          >
            취소
          </button>
          <button
            class="btn-confirm"
            onclick="confirmTextModal()"
            data-i18n="confirm"
          >
            확인
          </button>
        </div>
      </div>
    </div>

    <!-- ── 스크립트 ── -->
    <script>
      function toggleDropdown() {
        const menu = document.getElementById('dropdownMenu');
        if (menu) menu.classList.toggle('open');
      }
    </script>
    <script src="app.js"></script>
    <script src="ads.js"></script>
  </body>
</html>
